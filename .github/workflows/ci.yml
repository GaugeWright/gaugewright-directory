# Minimal CI for the blind account directory (ADR 0069, SPLIT-6).
# The gate runs the repository's own green bar so a local pass and a gate pass
# cannot mean different things. Add checks to scripts/check.sh, not to this file.
name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are wasted minutes, so they cancel. Trunk is
  # different: a cancelled run is recorded as `failure` with no failing
  # job, and that red says nothing about the change.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  green-bar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # platform/ points at the public GaugeDesk mirror, so the default token
      # reads it over HTTPS without a PAT secret.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # The green bar audits the dependency tree, so the tool it needs is
      # installed here rather than in a workflow that runs the audit separately.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit
      - run: scripts/check.sh
