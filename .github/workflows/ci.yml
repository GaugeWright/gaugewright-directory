# Minimal CI for the blind account directory (ADR 0069, SPLIT-6).
# The gate runs the repository's own green bar so a local pass and a gate pass
# cannot mean different things. Add checks to scripts/check.sh, not to this file.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Read-only by default; a job that needs more declares it.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are wasted minutes, so they cancel. Trunk is
  # different: a cancelled run is recorded as `failure` with no failing
  # job, and that red says nothing about the change.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  green-bar:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # platform/ points at the public GaugeDesk mirror, so the default token
      # reads it over HTTPS without a PAT secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      # The green bar audits the dependency tree, so the tool it needs is
      # installed here rather than in a workflow that runs the audit separately.
      # The green bar builds the documentation, so its toolchain is installed
      # here rather than in a workflow that builds the docs separately.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r docs/requirements.txt
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-audit
      - run: scripts/check.sh
