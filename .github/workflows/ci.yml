# Minimal CI for the blind account directory (ADR 0069, SPLIT-6).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # The platform/ submodule points at gaugebench, which is
      # currently PRIVATE: the default GITHUB_TOKEN cannot read it, so checkout
      # needs a PAT secret (e.g. GH_SUBMODULE_TOKEN with repo read scope) once
      # Actions billing is restored. Configure it as
      # `token: ${{ secrets.GH_SUBMODULE_TOKEN }}`.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
