# The security baseline every active GaugeWright repository carries: secret
# scanning over the complete history and static analysis. This repository had
# none until 2026-08-12 — it was one of two outside the baseline — so an
# introduced secret had nothing looking for it here at all.
#
# The dependency audit is a section of the green bar (scripts/check.sh), and
# nothing that runs a bar remains in .github/: every bar runs on the company's
# own fleet, which posts `gaugewright/bar` on main and on every pull request
# (GaugeWright DR-0131, FLEET.md stage 1). The scheduled `dependencies` job
# that re-ran the whole bar here for an advisory against an unchanged tree went
# with it.
name: security-baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `platform/` is the public GaugeDesk mirror. It is scanned in the
      # repository that owns it, and a finding there is not one this repository
      # could fix, so it stays out of every job here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      # The open-source scanner, not `gitleaks/gitleaks-action`: that wrapper
      # refuses to run for an organization without a paid `GITLEAKS_LICENSE`.
      # This is the same invocation the other repositories use, so they all
      # scan alike and none depends on a licence to answer.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: false
      - name: install pinned open-source gitleaks scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: scan the complete repository history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --no-banner --verbose'

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check semgrep==1.171.0
      # `p/r2c-security-audit` carries no Rust rules, so on this repository it
      # reads the `scripts/*.mjs` gate tooling and the JSON contracts. The Rust
      # surface is covered by the green bar's advisory audit and clippy run on
      # the fleet, not here. Keeping the job means the ruleset applies the day
      # it grows Rust coverage, and it already answers for the tooling.
      - run: semgrep --config p/r2c-security-audit --error --metrics=off
