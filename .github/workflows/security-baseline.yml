# The security baseline every active GaugeWright repository carries: secret
# scanning over the complete history, static analysis, and a dependency audit.
# This repository had none until 2026-08-12 — it was one of two outside the
# baseline — so an introduced secret or a published advisory had nothing looking
# for it here at all.
#
# The per-change runs are what make `secrets` and `sast` usable as required
# checks. The cron stays because it is what catches an advisory published
# against code that has not changed.
name: security-baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `platform/` is the public GaugeDesk mirror. It is scanned in the
      # repository that owns it, and a finding there is not one this repository
      # could fix, so it stays out of every job here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      # The open-source scanner, not `gitleaks/gitleaks-action`: that wrapper
      # refuses to run for an organization without a paid `GITLEAKS_LICENSE`.
      # This is the same invocation the other repositories use, so they all
      # scan alike and none depends on a licence to answer.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: false
      - name: install pinned open-source gitleaks scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: scan the complete repository history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --no-banner --verbose'

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check semgrep==1.171.0
      # `p/r2c-security-audit` carries no Rust rules, so on this repository it
      # reads the `scripts/*.mjs` gate tooling and the JSON contracts. The Rust
      # surface is covered by `dependencies` below and by the green bar's
      # clippy run, not here. Keeping the job means the ruleset applies the day
      # it grows Rust coverage, and it already answers for the tooling.
      - run: semgrep --config p/r2c-security-audit --error --metrics=off

  # The audit itself lives in scripts/check.sh, so the documented local green bar
  # and the enforced remote gate are the same command; ci.yml's green-bar job
  # runs it on every push and pull request. This job exists for the schedule,
  # which ci.yml does not have: an advisory can land against an unchanged
  # dependency tree, and nothing else re-runs the audit without a commit.
  dependencies:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The green bar builds against platform/, so this needs the submodule the
      # audit alone would not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      # The green bar builds the documentation, so its toolchain is installed
      # here rather than in a workflow that builds the docs separately.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r docs/requirements.txt
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit
      - run: scripts/check.sh
