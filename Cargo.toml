# gaugewright-directory — the blind account directory service (ACCT-2, ADR 0054).
# The free managed exception (pricing-and-editions): publicly auditable,
# continuously deployed, blind by construction. Extracted from the un-tie
# monorepo (ADR 0069, SPLIT-6) into this standalone repo.
#
# Platform consumption (ADR 0069, SPLIT-7 transitional): the open platform repo
# (gaugedesk) is vendored as the `platform/` git submodule, pinned
# to a known-good commit, and this crate takes `path` dependencies into it
# until the platform crates are published. Initialize it with
# `git submodule update --init` before building.
[package]
name = "gaugewright-directory"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"
description = "gaugewright blind account directory: readable signed routing records + opaque sealed account blobs."

[dependencies]
gaugedesk-core = { path = "platform/crates/core" }
gaugedesk-store = { path = "platform/crates/store" }
# The wire types and verifier the hosted edge Worker compiles to wasm, so this
# server and the hosted directory enforce one contract.
gaugedesk-directory-protocol = { path = "platform/crates/directory-protocol" }
sha2 = "0.11"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The pinned production client, so the wiring tests drive this server exactly as a
# GaugeDesk install does. Test-only: the server itself needs only the protocol crate.
gaugedesk-app = { path = "platform/crates/app", default-features = false }
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
proptest = "1"

[[bin]]
name = "gaugewright-directory"
path = "src/main.rs"

# Standalone package: stop cargo from walking up looking for a parent
# workspace. The platform submodule is its own (nested) workspace, so it must
# be excluded here.
[workspace]
# Reindeer's input for the native third-party targets is not a crate either.
exclude = ["platform", "third-party"]

# How this workspace is rendered as native Buck2 targets (GaugeWright BUILD.md
# stages 5 and 6): the cell and repository it is. Read by
# scripts/buckify-crates.py, which the GaugeWright repository renders here.
[workspace.metadata.native]
cell = "gaugewright-directory"
checkout = "gaugewright-directory"

# Dependencies are built without debug info. They dominate target/debug/deps,
# and debug info measured ~78% of binary size (whipplescript, 2026-07-25).
# Local crates keep full debuggability: panics and the debugger still work here.
[profile.dev.package."*"]
debug = false

# The platform takes WhippleScript from a pinned git revision rather than the
# crates.io release, through its own [patch.crates-io]. Cargo applies a patch
# only from the top-level workspace, which here is this package, so the same
# block is repeated at the same revision. Advancing the `platform` pin means
# copying this block from platform/Cargo.toml again.
[patch.crates-io]
whipplescript = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-kernel = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-parser = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-store = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
