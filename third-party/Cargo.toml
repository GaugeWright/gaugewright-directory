# @generated by scripts/buckify-crates.py from the workspace's Cargo.toml files.
# Reindeer's input for the native third-party targets (GaugeWright BUILD.md
# stage 5), not a crate: the workspace excludes it. After re-rendering, copy
# ../Cargo.lock here and run `reindeer --third-party-dir third-party buckify`.
[package]
name = "gaugewright-directory-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "top.rs"

[dependencies]
axum = { version = "=0.8.9" }
axum-0_7 = { package = "axum", version = "=0.7.9" }
base64 = { version = "=0.23.1" }
ciborium = { version = "=0.2.2" }
directories = { version = "=6.0.0" }
futures = { version = "=0.3.34" }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
getrandom-0_2 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
hex = { version = "=0.4.3" }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = { version = "=0.2.186" }
listenfd = { version = "=1.0.2" }
p256 = { version = "=0.14.0", features = ["ecdh", "ecdsa"] }
passkey-auth = { version = "=0.1.3" }
proptest = { version = "=1.11.0" }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "ring"] }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "tls12"] }
semver = { version = "=1.0.28" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0" }
tempfile = { version = "=3.27.0" }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ureq = { version = "=2.12.1", default-features = false, features = ["json", "tls"] }
url = { version = "=2.5.8" }
whipplescript = { version = "=0.5.6", default-features = false }
whipplescript-kernel = { version = "=0.5.6", features = ["native"] }
whipplescript-parser = { version = "=0.5.6" }
whipplescript-store = { version = "=0.5.6", features = ["native"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.103" }
wasm-bindgen = { version = "=0.2.126" }
wasm-bindgen-futures = { version = "=0.4.76" }
web-sys = { version = "=0.3.103", features = ["BinaryType", "CloseEvent", "ErrorEvent", "MessageEvent", "Request", "RequestInit", "Response", "WebSocket", "Window"] }

[patch.crates-io]
whipplescript = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-kernel = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-parser = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
whipplescript-store = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "d77dde542dd6f2c790ce29d4a94134915b06f924" }
